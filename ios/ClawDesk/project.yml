name: ClawDesk
options:
  bundleIdPrefix: com.holloway
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ClawDesk:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Claw Desk"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        NSMicrophoneUsageDescription: "Claw Desk uses the microphone only when you choose to dictate a message."
        NSSpeechRecognitionUsageDescription: "Speech recognition converts your chosen voice recordings into text."
        NSPhotoLibraryUsageDescription: "Select photos to attach to a Claw conversation."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.holloway.clawdesk
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
